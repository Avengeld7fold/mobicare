<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96">
  <defs>
    <filter id="gal-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#000000" flood-opacity="0.35" />
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#000000" flood-opacity="0.2" />
    </filter>
    <linearGradient id="gal-body" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.65" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.40" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.20" />
    </linearGradient>
    <linearGradient id="gal-rim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95" />
      <stop offset="35%" stop-color="#ffffff" stop-opacity="0.75" />
      <stop offset="70%" stop-color="#ffffff" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.55" />
    </linearGradient>
    <linearGradient id="gal-gloss" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.85" />
      <stop offset="60%" stop-color="#ffffff" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.0" />
    </linearGradient>
    <linearGradient id="gal-emboss" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.75" />
    </linearGradient>
  </defs>

  <g filter="url(#gal-shadow)">
    <!-- Back Photo Frame (Tilted) -->
    <rect x="28" y="14" width="54" height="48" rx="10" transform="rotate(7 55 38)"
          fill="rgba(255,255,255,0.22)"
          stroke="url(#gal-rim)"
          stroke-width="1.8" />

    <!-- Front Photo Frame -->
    <rect x="14" y="24" width="56" height="52" rx="10"
          fill="url(#gal-body)"
          stroke="url(#gal-rim)"
          stroke-width="2" />

    <!-- Top Gloss Sweep on Front Frame -->
    <path d="M16 34 C16 28, 20 25, 26 25 L58 25 C64 25, 68 28, 68 34 L68 44 C68 44, 42 50, 16 44 Z"
          fill="url(#gal-gloss)" />

    <!-- Sun Circle -->
    <circle cx="28" cy="40" r="5"
            fill="url(#gal-emboss)" />

    <!-- Mountain Landscape -->
    <path d="M14 66 L28 48 L40 62 L52 46 L70 66"
          fill="none"
          stroke="url(#gal-emboss)"
          stroke-width="2.8"
          stroke-linecap="round"
          stroke-linejoin="round" />
  </g>
</svg>
