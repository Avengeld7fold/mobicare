<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96">
  <defs>
    <filter id="cam-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#000000" flood-opacity="0.35" />
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#000000" flood-opacity="0.2" />
    </filter>
    <linearGradient id="cam-body" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.68" />
      <stop offset="45%" stop-color="#ffffff" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.22" />
    </linearGradient>
    <linearGradient id="cam-rim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95" />
      <stop offset="35%" stop-color="#ffffff" stop-opacity="0.75" />
      <stop offset="70%" stop-color="#ffffff" stop-opacity="0.30" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.55" />
    </linearGradient>
    <linearGradient id="cam-gloss" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.80" />
      <stop offset="60%" stop-color="#ffffff" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.0" />
    </linearGradient>
    <linearGradient id="cam-emboss" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.75" />
    </linearGradient>
  </defs>

  <g filter="url(#cam-shadow)">
    <!-- Camera Body Base -->
    <path d="M16 32 C16 26, 20 22, 26 22 L33 22 C35 22, 37 20, 39 17 L41 15 C43 12, 46 10, 50 10 L54 10 C58 10, 61 12, 63 15 L65 17 C67 20, 69 22, 71 22 L78 22 C84 22, 88 26, 88 32 L88 74 C88 80, 84 84, 78 84 L26 84 C20 84, 16 80, 16 74 Z"
          fill="url(#cam-body)"
          stroke="url(#cam-rim)"
          stroke-width="2" />

    <!-- Top Curved Gloss Highlight -->
    <path d="M18 33 C18 28, 22 24, 27 24 L77 24 C82 24, 86 28, 86 33 L86 44 C86 44, 60 52, 18 44 Z"
          fill="url(#cam-gloss)" />

    <!-- Lens Outer Ring -->
    <circle cx="52" cy="53" r="19"
            fill="none"
            stroke="url(#cam-rim)"
            stroke-width="2.5" />

    <!-- Lens Inner Glass -->
    <circle cx="52" cy="53" r="14"
            fill="url(#cam-body)"
            stroke="url(#cam-emboss)"
            stroke-width="1.8" />

    <!-- Lens Specular Glint -->
    <ellipse cx="48" cy="47" rx="5" ry="3" transform="rotate(-30 48 47)"
             fill="url(#cam-emboss)" />

    <!-- Viewfinder / Flash -->
    <rect x="72" y="29" width="8" height="6" rx="2"
          fill="url(#cam-emboss)" />
  </g>
</svg>
