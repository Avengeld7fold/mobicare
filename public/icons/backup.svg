<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96">
  <defs>
    <filter id="backup-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#000000" flood-opacity="0.35" />
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#000000" flood-opacity="0.2" />
    </filter>
    <linearGradient id="backup-body" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.65" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.40" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.20" />
    </linearGradient>
    <linearGradient id="backup-rim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95" />
      <stop offset="35%" stop-color="#ffffff" stop-opacity="0.75" />
      <stop offset="70%" stop-color="#ffffff" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.55" />
    </linearGradient>
    <linearGradient id="backup-gloss" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.85" />
      <stop offset="60%" stop-color="#ffffff" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.0" />
    </linearGradient>
    <linearGradient id="backup-emboss" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.75" />
    </linearGradient>
  </defs>

  <g filter="url(#backup-shadow)">
    <!-- Drive Outer Case -->
    <rect x="14" y="24" width="68" height="48" rx="12"
          fill="url(#backup-body)"
          stroke="url(#backup-rim)"
          stroke-width="2" />

    <!-- Top Gloss Sweep -->
    <path d="M16 34 C16 28, 20 25, 26 25 L70 25 C76 25, 80 28, 80 34 L80 44 C80 44, 50 50, 16 44 Z"
          fill="url(#backup-gloss)" />

    <!-- Horizontal Groove Divider -->
    <line x1="14" y1="52" x2="82" y2="52"
          stroke="url(#backup-rim)"
          stroke-width="1.8" />

    <!-- 5 Front Slits -->
    <rect x="28" y="60" width="3.5" height="8" rx="1.75" fill="url(#backup-emboss)" />
    <rect x="36" y="60" width="3.5" height="8" rx="1.75" fill="url(#backup-emboss)" />
    <rect x="44" y="60" width="3.5" height="8" rx="1.75" fill="url(#backup-emboss)" />
    <rect x="52" y="60" width="3.5" height="8" rx="1.75" fill="url(#backup-emboss)" />
    <rect x="60" y="60" width="3.5" height="8" rx="1.75" fill="url(#backup-emboss)" />

    <!-- Status LED -->
    <circle cx="72" cy="64" r="2.2" fill="url(#backup-emboss)" />
  </g>
</svg>
