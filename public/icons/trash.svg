<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96">
  <defs>
    <filter id="trash-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#000000" flood-opacity="0.35" />
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#000000" flood-opacity="0.2" />
    </filter>
    <linearGradient id="trash-body" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.65" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.40" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.20" />
    </linearGradient>
    <linearGradient id="trash-rim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95" />
      <stop offset="35%" stop-color="#ffffff" stop-opacity="0.75" />
      <stop offset="70%" stop-color="#ffffff" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.55" />
    </linearGradient>
    <linearGradient id="trash-gloss" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.85" />
      <stop offset="60%" stop-color="#ffffff" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.0" />
    </linearGradient>
    <linearGradient id="trash-emboss" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.75" />
    </linearGradient>
  </defs>

  <g filter="url(#trash-shadow)">
    <!-- Top Handle -->
    <path d="M38 18 C38 12, 58 12, 58 18"
          fill="none"
          stroke="url(#trash-rim)"
          stroke-width="3"
          stroke-linecap="round" />

    <!-- Lid -->
    <path d="M18 25 C18 22, 23 20, 28 20 L68 20 C73 20, 78 22, 78 25 L80 28 C80.5 29.5, 79 30, 77 30 L19 30 C17 30, 15.5 29.5, 16 28 Z"
          fill="url(#trash-body)"
          stroke="url(#trash-rim)"
          stroke-width="2" />
    <path d="M22 22 L74 22 C76 22, 77 23, 77 24 L76 26 L20 26 L19 24 C19 23, 20 22, 22 22 Z"
          fill="url(#trash-gloss)" />

    <!-- Can Body -->
    <path d="M22 34 L28 76 C29 82, 34 86, 40 86 L56 86 C62 86, 67 82, 68 76 L74 34 Z"
          fill="url(#trash-body)"
          stroke="url(#trash-rim)"
          stroke-width="2.2" />

    <!-- Curved Gloss Reflection on Body -->
    <path d="M23 35 L73 35 L71 48 C50 56, 30 50, 25 48 Z"
          fill="url(#trash-gloss)" />

    <!-- 3 Vertical Ribs -->
    <line x1="38" y1="44" x2="40" y2="74"
          stroke="url(#trash-emboss)"
          stroke-width="3.2"
          stroke-linecap="round" />
    <line x1="48" y1="44" x2="48" y2="74"
          stroke="url(#trash-emboss)"
          stroke-width="3.2"
          stroke-linecap="round" />
    <line x1="58" y1="44" x2="56" y2="74"
          stroke="url(#trash-emboss)"
          stroke-width="3.2"
          stroke-linecap="round" />
  </g>
</svg>
