<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96">
  <defs>
    <filter id="mag-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#000000" flood-opacity="0.35" />
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#000000" flood-opacity="0.2" />
    </filter>
    <linearGradient id="mag-body" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.65" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.40" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.20" />
    </linearGradient>
    <linearGradient id="mag-rim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95" />
      <stop offset="35%" stop-color="#ffffff" stop-opacity="0.75" />
      <stop offset="70%" stop-color="#ffffff" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.55" />
    </linearGradient>
    <linearGradient id="mag-gloss" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.85" />
      <stop offset="60%" stop-color="#ffffff" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.0" />
    </linearGradient>
    <linearGradient id="mag-emboss" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.75" />
    </linearGradient>
  </defs>

  <g filter="url(#mag-shadow)">
    <!-- 45-degree Cylindrical Handle -->
    <path d="M60 60 L78 78 C81 81, 85 81, 88 78 C91 75, 91 71, 88 68 L70 50 Z"
          fill="url(#mag-body)"
          stroke="url(#mag-rim)"
          stroke-width="2" />
    <line x1="64" y1="64" x2="84" y2="84"
          stroke="url(#mag-gloss)"
          stroke-width="1.8"
          stroke-linecap="round" />

    <!-- Outer Lens Rim -->
    <circle cx="42" cy="42" r="26"
            fill="url(#mag-body)"
            stroke="url(#mag-rim)"
            stroke-width="3" />

    <!-- Inner Refractive Lens -->
    <circle cx="42" cy="42" r="20"
            fill="rgba(255,255,255,0.20)" />

    <!-- Crescent Top-Left Gloss Arc -->
    <path d="M22 42 C22 30, 30 22, 42 22 C34 22, 26 30, 26 42 Z"
          fill="url(#mag-gloss)" />
  </g>
</svg>
