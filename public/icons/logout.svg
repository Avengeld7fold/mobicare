<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96">
  <defs>
    <filter id="out-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#000000" flood-opacity="0.35" />
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#000000" flood-opacity="0.2" />
    </filter>
    <linearGradient id="out-body" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.65" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.40" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.20" />
    </linearGradient>
    <linearGradient id="out-rim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95" />
      <stop offset="35%" stop-color="#ffffff" stop-opacity="0.75" />
      <stop offset="70%" stop-color="#ffffff" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.55" />
    </linearGradient>
    <linearGradient id="out-gloss" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.85" />
      <stop offset="60%" stop-color="#ffffff" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.0" />
    </linearGradient>
    <linearGradient id="out-emboss" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.75" />
    </linearGradient>
  </defs>

  <g filter="url(#out-shadow)">
    <!-- Door Frame Base -->
    <path d="M46 16 L24 16 C18 16, 14 20, 14 26 L14 70 C14 76, 18 80, 24 80 L46 80"
          fill="none"
          stroke="url(#out-rim)"
          stroke-width="5"
          stroke-linecap="round"
          stroke-linejoin="round" />

    <!-- Top Gloss on Door Frame -->
    <path d="M14 36 L14 26 C14 20, 18 16, 24 16 L46 16"
          fill="none"
          stroke="url(#out-gloss)"
          stroke-width="5"
          stroke-linecap="round" />

    <!-- Outward Arrow Stem -->
    <line x1="32" y1="48" x2="78" y2="48"
          stroke="url(#out-emboss)"
          stroke-width="5.5"
          stroke-linecap="round" />

    <!-- Arrow Head -->
    <polyline points="64,34 78,48 64,62"
              fill="none"
              stroke="url(#out-emboss)"
              stroke-width="5.5"
              stroke-linecap="round"
              stroke-linejoin="round" />
  </g>
</svg>
