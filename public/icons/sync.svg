<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96">
  <defs>
    <filter id="sync-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#000000" flood-opacity="0.35" />
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#000000" flood-opacity="0.2" />
    </filter>
    <linearGradient id="sync-body" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.65" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.40" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.20" />
    </linearGradient>
    <linearGradient id="sync-rim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95" />
      <stop offset="35%" stop-color="#ffffff" stop-opacity="0.75" />
      <stop offset="70%" stop-color="#ffffff" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.55" />
    </linearGradient>
    <linearGradient id="sync-gloss" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.85" />
      <stop offset="60%" stop-color="#ffffff" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.0" />
    </linearGradient>
    <linearGradient id="sync-emboss" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.75" />
    </linearGradient>
  </defs>

  <g filter="url(#sync-shadow)">
    <!-- Top-Right Curved Arc Arrow -->
    <path d="M80 44 C78 28, 64 16, 48 16 C34 16, 23 24, 18 36"
          fill="none"
          stroke="url(#sync-rim)"
          stroke-width="5"
          stroke-linecap="round" />
    <polygon points="80,24 88,44 68,44"
             fill="url(#sync-body)"
             stroke="url(#sync-rim)"
             stroke-width="2"
             stroke-linejoin="round" />

    <!-- Bottom-Left Curved Arc Arrow -->
    <path d="M16 52 C18 68, 32 80, 48 80 C62 80, 73 72, 78 60"
          fill="none"
          stroke="url(#sync-rim)"
          stroke-width="5"
          stroke-linecap="round" />
    <polygon points="16,72 8,52 28,52"
             fill="url(#sync-body)"
             stroke="url(#sync-rim)"
             stroke-width="2"
             stroke-linejoin="round" />

    <!-- Specular Gloss Points -->
    <circle cx="36" cy="18" r="3" fill="url(#sync-gloss)" />
    <circle cx="60" cy="78" r="3" fill="url(#sync-gloss)" />
  </g>
</svg>
