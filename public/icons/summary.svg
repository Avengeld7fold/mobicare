<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96">
  <defs>
    <filter id="sum-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#000000" flood-opacity="0.35" />
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#000000" flood-opacity="0.2" />
    </filter>
    <linearGradient id="sum-body" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.65" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.40" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.20" />
    </linearGradient>
    <linearGradient id="sum-rim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95" />
      <stop offset="35%" stop-color="#ffffff" stop-opacity="0.75" />
      <stop offset="70%" stop-color="#ffffff" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.55" />
    </linearGradient>
    <linearGradient id="sum-gloss" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.85" />
      <stop offset="60%" stop-color="#ffffff" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.0" />
    </linearGradient>
    <linearGradient id="sum-emboss" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.75" />
    </linearGradient>
  </defs>

  <g filter="url(#sum-shadow)">
    <!-- Document / Window Frame -->
    <rect x="14" y="14" width="68" height="68" rx="14"
          fill="url(#sum-body)"
          stroke="url(#sum-rim)"
          stroke-width="2" />

    <!-- Top Gloss Sweep -->
    <path d="M16 26 C16 19, 20 16, 26 16 L70 16 C76 16, 80 19, 80 26 L80 36 C80 36, 50 42, 16 36 Z"
          fill="url(#sum-gloss)" />

    <!-- Titlebar Divider -->
    <line x1="14" y1="32" x2="82" y2="32"
          stroke="url(#sum-rim)"
          stroke-width="1.6" />

    <!-- 3 Traffic Dots -->
    <circle cx="23" cy="23" r="2.5" fill="url(#sum-emboss)" />
    <circle cx="30" cy="23" r="2.5" fill="url(#sum-emboss)" />
    <circle cx="37" cy="23" r="2.5" fill="url(#sum-emboss)" />

    <!-- Sidebar Split -->
    <line x1="36" y1="32" x2="36" y2="82"
          stroke="url(#sum-rim)"
          stroke-width="1.6" />

    <!-- Sidebar Items -->
    <rect x="20" y="42" width="10" height="3" rx="1.5" fill="url(#sum-emboss)" />
    <rect x="20" y="50" width="10" height="3" rx="1.5" fill="url(#sum-emboss)" />
    <rect x="20" y="58" width="10" height="3" rx="1.5" fill="url(#sum-emboss)" />

    <!-- Metric Card 1 -->
    <rect x="44" y="40" width="30" height="16" rx="4"
          fill="rgba(255,255,255,0.25)"
          stroke="url(#sum-rim)"
          stroke-width="1.2" />
    <rect x="48" y="45" width="14" height="2.5" rx="1.2" fill="url(#sum-emboss)" />
    <rect x="48" y="50" width="22" height="2" rx="1" fill="url(#sum-emboss)" />

    <!-- Metric Card 2 -->
    <rect x="44" y="60" width="30" height="15" rx="4"
          fill="rgba(255,255,255,0.25)"
          stroke="url(#sum-rim)"
          stroke-width="1.2" />
    <rect x="48" y="65" width="18" height="2.5" rx="1.2" fill="url(#sum-emboss)" />
    <rect x="48" y="70" width="12" height="2" rx="1" fill="url(#sum-emboss)" />
  </g>
</svg>
